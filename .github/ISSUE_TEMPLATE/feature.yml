name: Feature request
description: Suggest an improvement to Claude Arcade.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: policy
    attributes:
      label: Project principles
      options:
        - label: This needs no network access, tracking or runtime dependencies.
          required: true
